services:
  nginx:
    image: nginx:alpine
    container_name: teacher-nginx
    ports:
      - "127.0.0.1:8080:80"
    mem_limit: 64m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./frontend:/usr/share/nginx/html:ro
    depends_on:
      - backend
    restart: unless-stopped

  backend:
    build: .
    container_name: teacher-backend
    mem_limit: 512m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    expose:
      - "8080"
    volumes:
      - teacher-data:/data
    restart: unless-stopped

volumes:
  teacher-data:
