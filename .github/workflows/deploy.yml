name: Deploy backend

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build with Maven
        run: mvn package -DskipTests -q

      - name: Copy files to server
        if: github.event_name == 'push'
        uses: appleboy/scp-action@v0.1.7
        with:
          host: 192.144.15.170
          username: user33
          key: ${{ secrets.DEPLOY_KEY }}
          source: "target/*.jar,docker-compose.yml,Dockerfile,nginx.conf"
          target: "/opt/teacher/teacher-backend"
          strip_components: 0

      - name: Restart containers
        if: github.event_name == 'push'
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 192.144.15.170
          username: user33
          key: ${{ secrets.DEPLOY_KEY }}
          script: |
            set -e
            cd /opt/teacher/teacher-backend
            docker compose up --build -d
            docker compose restart nginx
            docker image prune -f --filter "label=com.docker.compose.project=teacher-backend" || true
